name: TapNow Runtime Plugins
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          fi
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run extension:zip
      - run: node scripts/runtime-channel.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tapnow-runtime-plugins
          path: |
            releases/*-chrome.zip
            runtime-channel.json
      - name: Publish verified plugin assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "TapNow $GITHUB_REF_NAME" --notes 'Optional ACU Runtime browser plugins. Chrome loading requires user confirmation. No shared trial key is bundled.' releases/*-chrome.zip runtime-channel.json
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
    permissions:
      contents: write
